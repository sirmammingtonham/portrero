name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: scripts/test.sh

      - name: Build
        run: scripts/build.sh --universal

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Portrero-${{ github.sha }}
          path: build/Portrero.app
          retention-days: 7
